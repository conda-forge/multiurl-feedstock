{% set version = "0.3.10" %}

package:
  name: multiurl
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/multiurl/multiurl-{{ version }}.tar.gz
  sha256: 139927318b0a92d7f254d49ca4ea8544a4e3224e615fd2ed79408fe6d2d10e61

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - python-dateutil
    - pytz
    - requests
    - tqdm

test:
  requires:
    - python {{ python_min }}
  imports:
    - multiurl

about:
  home: https://github.com/ecmwf/multiurl
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: A package to download several URL as one

extra:
  recipe-maintainers:
    - raybellwaves
